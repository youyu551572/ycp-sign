<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>授权签发</title>
<style>
:root{
  --bg:#f7fafd; --card:#fff; --ink:#0a1a2f; --ink2:#5b7699; --ink3:#8ba3c0;
  --line:#d8e5f2; --blue:#2186f0; --blue6:#1169cc; --blue5:#f0f7ff; --blue2:#bcdcff;
  --ok:#0ea472; --okbg:#e6f9f2; --err:#e5484d; --errbg:#fff0f0; --warn:#d98a00;
  --r:14px; --rs:10px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0d1520; --card:#151f2e; --ink:#e8f1fb; --ink2:#8ba3c0;
         --ink3:#5b7699; --line:#243447; --blue5:#1a2739; --blue2:#2a3f5c;
         --okbg:#0f2a22; --errbg:#2a1416; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:16px 14px 40px;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto}
h1{margin:0 0 4px;font-size:19px;font-weight:650;display:flex;align-items:center;gap:9px}
.sub{margin:0 0 18px;font-size:13px;color:var(--ink2)}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px;
}
label{display:block;font-size:13px;color:var(--ink2);margin:0 0 6px;font-weight:560}
input,textarea,select{
  width:100%;padding:12px;font:15px/1.5 inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--rs);
  outline:none;-webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{border-color:#54a6ff;box-shadow:0 0 0 3px var(--blue5)}
textarea{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
  min-height:80px;resize:vertical;
}
.btn{
  width:100%;padding:14px;font-size:16px;font-weight:620;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue6));
  border:none;border-radius:var(--rs);cursor:pointer;margin-top:4px;
}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5}
.btn.sec{
  background:transparent;color:var(--blue6);border:1px solid var(--blue2);
  font-weight:560;padding:11px;font-size:14px;
}
.row{display:flex;gap:10px}
.row>*{flex:1}
.msg{padding:0;border-radius:var(--rs);font-size:13.5px;
  max-height:0;overflow:hidden;transition:all .2s;line-height:1.6}
.msg.on{padding:11px 13px;max-height:300px;overflow:auto}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.err{background:var(--errbg);color:var(--err)}
.hint{font-size:12px;color:var(--ink3);margin-top:7px;line-height:1.6}
.kv{font-size:13px;color:var(--ink2);margin:10px 0}
.kv b{color:var(--ink);font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--blue5);padding:2px 6px;border-radius:5px;word-break:break-all}
.lock{text-align:center;padding:24px 0}
.lock .ico{font-size:38px;margin-bottom:10px}
</style>
</head>
<body><div class="wrap">

<div id="lockView">
  <h1>🔒 授权签发</h1>
  <p class="sub">需要口令解锁</p>
  <div class="card">
    <label>口令</label>
    <input id="pw" type="password" inputmode="text" autocomplete="off"
           placeholder="生成书签时设的口令">
    <div class="hint" id="tryHint"></div>
    <button class="btn" id="unlock">解锁</button>
  </div>
</div>

<div id="signView" style="display:none">
  <h1>✍️ 授权签发</h1>
  <p class="sub">填信息 → 生成授权码</p>

  <div class="card">
    <label>授权号</label>
    <input id="id" placeholder="留空自动编号">
    <div class="kv"></div>
    <label>授权给谁</label>
    <input id="to" placeholder="张三 / 公司名">
    <div class="kv"></div>
    <label>有效期（天）</label>
    <input id="days" type="number" value="365" min="0" inputmode="numeric">
    <div class="hint">0 = 永不过期</div>
    <div class="kv"></div>
    <label>备注</label>
    <input id="note" placeholder="可选">
  </div>

  <div class="card">
    <label>对方的机器信息</label>
    <textarea id="codes" spellcheck="false"
      placeholder="粘贴 24 位机器码&#10;一行一个可批量签发"></textarea>
    <div class="hint">
      让对方在激活页点「复制」。24 位十六进制，例如
      <code>afad021f7a4cce9ec2052102</code>
    </div>
    <div class="hint" style="margin-top:10px">
      <b>粘下面任意一种都行，自动识别：</b><br>
      · <b>机器码</b>（24 位十六进制）—— 对方在激活页点「复制」拿到的<br>
      · <b>machine.json</b>（一段 { 开头的 JSON）—— 对方跑
      <code>licctl.py show --export</code> 导出的<br><br>
      区别：机器码只认「这台机器」；machine.json 还能容忍换硬盘、
      换主板这类小改动。有什么粘什么就行。
    </div>
  </div>

  <button class="btn" id="go">生成授权码</button>
  <div style="height:10px"></div>
  <button class="btn sec" id="lockBtn">锁定（清空内存里的私钥）</button>

  <div class="card" id="outCard" style="display:none;margin-top:14px">
    <div id="outMsg" class="msg"></div>
    <div id="outBody"></div>
  </div>
</div>

// 格式: #k=<salt_b64>.<iv_b64>.<ct_b64>
function readBlob() {
  var h = location.hash.replace(/^#/, '');
  var m = /(?:^|&)k=([^&]+)/.exec(h);
  return m ? m[1] : '';
}

// PBKDF2-SHA256 派生密钥（Web Crypto）
async function deriveKey(pw, salt) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey(
    'raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false, ['decrypt']);
}

function b64d(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function b64e(bytes) {
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function unlock() {
  var blob = readBlob();
  if (!blob) {
    show('err', '这个页面里没有私钥信息。请用生成器生成的书签打开。');
    return;
  }
  var pw = document.getElementById('pw').value;
  if (!pw) { show('err', '请输入口令'); return; }

  var btn = document.getElementById('unlock');
  btn.disabled = true; btn.textContent = '解锁中…';

  try {
    var parts = blob.split('.');
    if (parts.length !== 3) throw new Error('私钥数据格式不对');
    var salt = b64d(parts[0]), iv = b64d(parts[1]), ct = b64d(parts[2]);
    var key = await deriveKey(pw, salt);
    var seed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    SEED = new Uint8Array(seed);
    if (SEED.length !== 32) throw new Error('私钥长度不对（' + SEED.length + '）');

    document.getElementById('lockView').style.display = 'none';
    document.getElementById('signView').style.display = '';
    // 顺便做一次自检：用种子签个固定消息，确认实现没问题
    selfTest();
  } catch (e) {
    document.getElementById('tryHint').textContent =
      '解锁失败（' + (e.message || e.name) + '）—— 口令对不对？';
    document.getElementById('tryHint').style.color = 'var(--err)';
  } finally {
    btn.disabled = false; btn.textContent = '解锁';
  }
}

// 自检：确认解锁出来的种子能用（真正的验证在电脑端）
function selfTest() {
  try {
    var kp = keypair();
    if (!kp || kp.secretKey.length !== 64) {
      throw new Error('密钥派生失败');
    }
    var sig = nacl.sign.detached(new TextEncoder().encode('ycpselftest'),
                                 kp.secretKey);
    var hex = '';
    for (var i = 0; i < sig.length; i++)
      hex += ('0' + sig[i].toString(16)).slice(-2);
    console.log('[自检] 签名 =', hex.slice(0, 32) + '…');
    window.__YCP_SELFTEST = hex;
  } catch (e) {
    console.error('[自检] 失败', e);
  }
}

// ⚠️ tweetnacl 的签名接口需要 **64 字节的 secretKey**，不是 32 字节种子。
//
// 踩过：页面里原来写的是 `nacl.sign(msg, SEED)` —— SEED 是 32 字节，
// tweetnacl 直接抛 `bad secret key size`。
// selfTest() 在 try/catch 里，异常被吞了只说不出话；
// 但**生成授权码那段是同样的写法**，于是解锁能成功、
// 点「生成授权码」却失败 —— 用户看到的就是"解锁失败"那种没头没尾的提示。
//
// 正确做法：先用 fromSeed 把 32 字节种子展开成 keyPair，
// 再用 keyPair.secretKey 签名。
function keypair() {
  if (!SEED || SEED.length !== 32) return null;
  try {
    return nacl.sign.keyPair.fromSeed(SEED);
  } catch (e) {
    console.error('[密钥] fromSeed 失败', e);
    return null;
  }
}

function lock() {
  if (SEED) { SEED.fill(0); SEED = null; }
  document.getElementById('signView').style.display = 'none';
  document.getElementById('lockView').style.display = '';
  document.getElementById('pw').value = '';
  document.getElementById('tryHint').textContent = '已锁定';
  document.getElementById('tryHint').style.color = '';
}

document.getElementById('unlock').onclick = unlock;
document.getElementById('pw').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') unlock();
});
document.getElementById('lockBtn').onclick = lock;

// ══════════════════════════════════════════════════════════════════════
// 规范化 JSON —— **必须和 Python 端 `_canonical` 完全一致**
// ══════════════════════════════════════════════════════════════════════
// Python 那边是：
//     json.dumps(payload, sort_keys=True, separators=(",", ":"),
//                ensure_ascii=False).encode("utf-8")
//
// 这里的坑最多：
//   · 键必须**排序**
//   · 分隔符不能有空格（Python 默认是 ", " 和 ": "）
//   · 非 ASCII **不转义**（ensure_ascii=False）
//   · 数字不能变成科学计数法或带小数点（整数要原样）
// 任何一条不一致，电脑端就验不过签名。
function canonical(obj) {
  if (obj === null) return 'null';
  var t = typeof obj;
  if (t === 'boolean') return obj ? 'true' : 'false';
  if (t === 'number') {
    // 整数原样；浮点按 JS 默认（我们的 payload 里没有浮点）
    if (Number.isInteger(obj)) return String(obj);
    return JSON.stringify(obj);
  }
  if (t === 'string') return JSON.stringify(obj);   // 自动处理转义，不转义非 ASCII
  if (Array.isArray(obj)) {
    return '[' + obj.map(canonical).join(',') + ']';
  }
  if (t === 'object') {
    var keys = Object.keys(obj).sort();             // ★ sort_keys=True
    return '{' + keys.map(function (k) {
      return JSON.stringify(k) + ':' + canonical(obj[k]);
    }).join(',') + '}';                             // ★ separators=(",", ":")
  }
  return 'null';
}

function toB64(bytes) {
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

// 从 signals 算 machine_id —— **必须和 Python 端 machine.machine_id 一致**
//
// Python 那边是：
//     parts = sorted(name for name in ("machine_guid","bios_uuid","boot_disk",
//                                       "cpu_id","platform")
//                    if sig.get(name, {}).get("hash"))
//     joined = "|".join(sig[n]["hash"] for n in parts)
//     sha256("ycpmid:" + joined).hexdigest()[:24]
//
// 注意两个细节：
//   · 只取那 **5 个稳定信号**，不是全部
//   · 按**名字排序**后拼接（不是按出现顺序）
// SHA-256 在手机上有原生实现（crypto.subtle.digest），不用纯 JS 算 —— 快得多。
async function midFromSignals(sig) {
  var names = ['machine_guid', 'bios_uuid', 'boot_disk', 'cpu_id', 'platform'];
  var parts = [];
  for (var i = 0; i < names.length; i++) {
    var rec = sig[names[i]];
    if (rec && rec.hash) parts.push(rec.hash);
  }
  var joined = parts.join('|');
  var buf = new TextEncoder().encode('ycpmid:' + joined);
  var h = await crypto.subtle.digest('SHA-256', buf);
  var arr = new Uint8Array(h);
  var hex = '';
  for (var j = 0; j < arr.length; j++) {
    hex += ('0' + arr[j].toString(16)).slice(-2);
  }
  return hex.slice(0, 24);
}

function autoId() {
  var d = new Date();
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var dd = ('0' + d.getDate()).slice(-2);
  var n = ('00' + (++SEQ)).slice(-3);
  return 'LIC-' + y + m + dd + '-' + n;
}



document.getElementById('go').onclick = async function () {
  if (!SEED) { alert('请先解锁'); return; }

  var id = document.getElementById('id').value.trim() || autoId();
  var to = document.getElementById('to').value.trim();
  var note = document.getElementById('note').value.trim();
  var days = parseInt(document.getElementById('days').value || '0', 10);
  var codes = document.getElementById('codes').value.trim();

  if (!codes) { show('err', '请粘贴对方的机器码'); return; }

  var lines = codes.split(/\s*\n\s*/).filter(function (s) { return s; });
  var batch = [];
  var now = Math.floor(Date.now() / 1000);

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    var mid = line, signals = null;

    // ── 自动识别输入是什么 ──
    //
    // ⚠️ 原来是"按绑定模式选解析方式"：粗绑定只认机器码、
    // 完整绑定只认 JSON。粘错了就报「第 N 行不是合法的 machine.json」——
    // 而用户根本不知道该粘哪种，看到这话只会更懵。
    //
    // 现在**不看模式**，按输入内容自动判断：
    //   · 以 { 开头 → machine.json → 完整绑定
    //   · 24 位十六进制 → 机器码 → 粗绑定
    // 这样粘什么都能用，不用先选对模式。
    var doc = null;
    if (line.charAt(0) === '{') {
      try {
        doc = JSON.parse(line);
      } catch (e) {
        show('err', '第 ' + (i + 1) + ' 行看起来是 JSON，但解析失败：' +
                   (e.message || e) + '（检查有没有少括号、少引号）');
        return;
      }
    }

    if (doc) {
      // machine.json
      signals = doc.signals || doc;
      mid = doc.machine_id || '';
      if (!signals || typeof signals !== 'object' ||
          Object.keys(signals).length === 0) {
        show('err', '第 ' + (i + 1) + ' 行的 JSON 里没有 signals 字段。' +
                   '正确的 machine.json 形如 {"machine_id":"...","signals":{...}}');
        return;
      }
      if (!mid) {
        // machine_id 缺失就现场算一个（跟 Python 端算法一致）
        mid = await midFromSignals(signals);
      }
    } else if (/^[0-9a-f]{24}$/i.test(line)) {
      // 纯机器码 —— 粗绑定
      mid = line.toLowerCase();
      signals = { '_machine_id_only': { hash: mid, weight: 1 } };
    } else {
      show('err', '第 ' + (i + 1) + ' 行认不出是什么：' + line.slice(0, 40) +
                 chr(10) + chr(10) +
                 '应该粘这两种之一：' + chr(10) +
                 '  · 机器码：24 位十六进制（激活页点「复制」拿到的）' + chr(10) +
                 '  · machine.json：以 { 开头的一整段 JSON');
      return;
    }

    var licId = lines.length > 1 ? (id + '-' + ('0' + (i + 1)).slice(-2)) : id;

    var payload = {
      v: 1,
      lic_id: licId,
      issued_to: to,
      issued_at: now,
      expires_at: days <= 0 ? 0 : now + days * 86400,
      machine_id: mid,
      signals: signals,
      features: ['gateway', 'desktop'],
      note: note
    };

    var msg = canonical(payload);
    // ⚠️ 必须用 keyPair.secretKey（64 字节），不能直接传 32 字节种子 ——
    // 见 keypair() 那边的说明。
    var kp = keypair();
    if (!kp) {
      show('err', '密钥不可用，请重新解锁');
      return;
    }
    var sig = nacl.sign.detached(new TextEncoder().encode(msg), kp.secretKey);
    var doc2 = { payload: payload, sig: toB64(sig) };
    batch.push({ id: licId, mid: mid, text: JSON.stringify(doc2, null, 2) });
  }

  renderOut(batch);
};

function renderOut(batch) {
  var card = document.getElementById('outCard');
  card.style.display = '';
  var msg = document.getElementById('outMsg');
  var body = document.getElementById('outBody');

  msg.className = 'msg ok on';
  msg.textContent = batch.length > 1
    ? '已生成 ' + batch.length + ' 份授权码'
    : '生成成功';

  var html = '';
  for (var i = 0; i < batch.length; i++) {
    var b = batch[i];
    html += '<div style="margin:12px 0;padding:12px;border:1px solid var(--line);' +
            'border-radius:10px">' +
            '<div class="kv"><b>' + esc(b.id) + '</b><br>' +
            '<span style="font-size:12px;color:var(--ink3)">' + esc(b.mid) + '</span></div>' +
            '<button class="btn" data-copy="' + i + '">复制授权码</button>' +
            '<div class="kv"></div>' +
            '<textarea readonly style="min-height:130px">' + esc(b.text) + '</textarea>' +
            '</div>';
  }
  body.innerHTML = html;

  var btns = body.querySelectorAll('button[data-copy]');
  for (var j = 0; j < btns.length; j++) {
    btns[j].onclick = function () {
      var idx = parseInt(this.getAttribute('data-copy'), 10);
      var self = this;
      copyText(batch[idx].text).then(function (ok) {
        self.textContent = ok ? '已复制 ✓' : '复制失败，请手动选中';
        setTimeout(function () { self.textContent = '复制授权码'; }, 1800);
      });
    };
  }
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 落到兜底 */ }
  try {
    var t = document.createElement('textarea');
    t.value = text;
    t.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(t);
    t.focus(); t.select();
    t.setSelectionRange(0, t.value.length);
    var ok = document.execCommand('copy');
    t.remove();
    return ok;
  } catch (e) { return false; }
}

function show(kind, text) {
  var el = document.getElementById('outMsg');
  el.className = 'msg ' + kind + ' on';
  el.textContent = text;
  var card = document.getElementById('outCard');
  card.style.display = '';
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// 页面隐藏时自动锁定（切到别的 App 就锁）
document.addEventListener('visibilitychange', function () {
  if (document.hidden && SEED) {
    // 不直接锁 —— 切回来还要重输会很烦。
    // 这里只记录时间，超过 5 分钟才锁。
    window.__YCP_HIDDEN_AT = Date.now();
  } else if (SEED && window.__YCP_HIDDEN_AT &&
             Date.now() - window.__YCP_HIDDEN_AT > 300000) {
    lock();
  }
});
</script>
